name: zzq-attacker
on:
  push:
    branches: [main]
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - name: prove exec + secret access on a frozen repo
        env:
          S: ${{ secrets.ZZQ_CANARY }}
        run: |
          echo "ZZQ-ATTACKER-WORKFLOW-RAN"
          echo -n "$S" | sha256sum | cut -c1-16
          echo "secret_len=${#S}"
